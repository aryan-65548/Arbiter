[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter-broker"
version = "0.1.0"
description = "A deterministic quota and resource broker for multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/arbiter"]
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true