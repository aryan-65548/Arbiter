[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter-broker"
version = "0.1.0"
description = "A deterministic quota and resource broker for multi-agent LLM systems"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]